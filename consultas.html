    <meta name="keywords" content="Abierto Pampeano, consultar heat, heat de baile, D&A Escuela de Baile, ballroom dance, La Pampa">

        .btn-cta {

        }

        #resultadoDiv {

        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        th {
            background-color: var(--color-principal);
            color: var(--color-negro);
            padding: 10px;
            text-align: center;
        }

        td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) td {
            background-color: #fef6e7;
        }

        .heat-title {
            background-color: var(--color-secundario);
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }

        .no-result {
            text-align: center;
            color: red;
            font-weight: bold;
            margin-top: 20px;
        }

        .navbar {
            background-color: #000000 !important;
        }

        footer {
            font-size: 0.9rem;
            background-color: #000000;
            color: white;
            text-align: center;
            padding: 20px 0;
        }

        footer a {
            color: white;
            text-decoration: underline;
        }
    </style>

<body>

      <ul class="navbar-nav ms-auto">

<!-- Contenedor principal -->
<div class="container" style="margin-top: 100px;">
    <h1>Consultar tu Heat</h1>
    <p class="text-center">Ingresá tu Dorsal o DNI para ver tu participación.</p>

    <div class="row justify-content-center mb-3">
        <div class="col-md-6">
            <input type="text" id="busquedaInput" placeholder="DNI o Dorsal">
            <button id="buscarBtn" class="btn btn-cta mt-2 w-100">Consultar</button>
        </div>
    </div>

    <div id="resultadoDiv"></div>
</div>

<!-- Footer -->
<footer class="text-center py-3 bg-dark text-white">
  <p>© 2025 Abierto Pampeano</p>
  <p>
    Diseñado por 
    <a href="https://www.instagram.com/jorge_santillan_dg?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="text-white text-decoration-underline">
      Jorge Santillan <img src="Public/Imagen de WhatsApp 2025-08-12 a las 19.38.33_bc11c0ab.jpg" height="20" alt="Logo Jorge">
    </a>
  </p>
  <p>
    Desarrollado por 
    <a href="https://kevinluna94.github.io/sitio-web-portfolio-kevinluna/" target="_blank" class="text-white text-decoration-underline">
      Kevin Luna <img src="Public/Logo-Kevin-Luna.svg" height="30" alt="Logo Kevin">
    </a>
  </p>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const input = document.getElementById("busquedaInput");
    const resultadoDiv = document.getElementById("resultadoDiv");

    document.getElementById("buscarBtn").addEventListener("click", function() {
        const valor = input.value.trim();
        resultadoDiv.innerHTML = "";

        if (!valor) {
            alert("Por favor, ingresá tu DNI o Dorsal.");
            return;
        }

        fetch("Public/heats.xlsx")
            .then(response => response.arrayBuffer())
            .then(data => {
                const workbook = XLSX.read(data, { type: "array" });
                let resultados = [];

                workbook.SheetNames.forEach(sheetName => {
                    const sheet = workbook.Sheets[sheetName];
                    const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

                    let currentHeat = "";
                    rawData.forEach(row => {
                        if (row[0] && row[0].toString().toUpperCase().startsWith("HEAT")) {
                            currentHeat = row[0];
                            return;
                        }
                        if (!row[0] || row[0].toString().toLowerCase() === "dorsal") return;

                        const fila = {
                            heat: currentHeat,
                            DORSAL: row[0]?.toString().trim(),
                            leaderName: row[1]?.toString().trim(),
                            followerName: row[3]?.toString().trim(),
                            escuela: row[5]?.toString().trim(),
                            baile: row[9]?.toString().trim()
                        };

                        if (
                            fila.DORSAL === valor ||
                            row[2]?.toString().trim() === valor || // Leader DNI
                            row[4]?.toString().trim() === valor  // Follower DNI
                        ) {
                            resultados.push(fila);
                        }
                    });
                });

                if (resultados.length === 0) {
                    resultadoDiv.innerHTML = "<p class='no-result'>No se encontraron resultados.</p>";
                    return;
                }

                resultados.forEach(item => {
                    const heatDiv = document.createElement("div");
                    heatDiv.innerHTML = `
                        <div class="heat-title">${item.heat}</div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Dorsal</th>
                                    <th>Leader</th>
                                    <th>Follower</th>
                                    <th>Escuela</th>
                                   
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>${item.DORSAL}</td>
                                    <td>${item.leaderName}</td>
                                    <td>${item.followerName}</td>
                                    <td>${item.escuela}</td>
                                    
                                </tr>
                            </tbody>
                        </table>
                    `;
                    resultadoDiv.appendChild(heatDiv);
                });

                input.value = "";
            })
            .catch(error => {
                console.error("Error al cargar el Excel:", error);
                resultadoDiv.innerHTML = "<p class='no-result'>Error al cargar el archivo de Heat.</p>";
            });
    });
</script>
</body>
</html>
